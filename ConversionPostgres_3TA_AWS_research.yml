---
- name: Adjustments for EL conversions research
  become: true
  hosts: "{{ app_stack_name }}_appdbs"
  gather_facts: true
  tasks:
    - name: Print out ansible_distribution and ansible_distribution_major_version
      debug:
        msg: "Current OS: {{ ansible_distribution }}{{ ansible_distribution_major_version }}"

    - ansible.builtin.set_fact:
        _3ta_os_distribution: "{{ ansible_distribution }}"
        _3ta_os_major_version: "{{ ansible_distribution_major_version }}"

    - name: Call __convert_os from db-tier role       
      ansible.builtin.import_role:
        name: db-tier
        tasks_from: "__conversion_{{ _3ta_os_distribution }}{{ _3ta_os_major_version }}.yml"
...
