---
- name: Deploy PostgreSQL server
  become: true
  hosts: "{{ app_stack_name }}_appdbs"
  gather_facts: true
  pre_tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:  
  roles:
    - name: db-tier
      tags:
        - db-tier
        - dbs
        - PostgreSQL

- name: Deploy application servers
  become: true
  hosts: "{{ app_stack_name }}_apps"
  gather_facts: true
  vars:
    AnsibleGroup_appdbs: "{{ app_stack_name }}_appdbs"
  pre_tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:
  roles:
    - name: app-tier
      tags:
        - app-tier
        - apps
        - Tomcat

- name: Deploy load balancer servers
  become: true
  hosts: "{{ app_stack_name }}_frontends"
  gather_facts: true
  pre_tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:
  roles:
    - name: lb-tier
      haproxy_group: "{{ app_stack_name }}_apps"
      tags:
        - lb-tier
        - lbs
        - HAProxy
...
